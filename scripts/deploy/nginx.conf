user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
include /usr/share/nginx/modules/*.conf;
events { worker_connections 256; }
http {
    # Omit query strings and request bodies, including auth recovery parameters.
    log_format trama '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /var/log/nginx/access.log trama;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 30;
    server_tokens off;
    include /etc/nginx/conf.d/*.conf;
}
