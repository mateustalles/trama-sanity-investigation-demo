server {
    listen 80 default_server;
    server_name _;
    return 404;
}
server {
    listen 80;
    server_name trama.beautyqueenz.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/trama-demo/acme;
    }
    location / { return 301 https://trama.beautyqueenz.com$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name trama.beautyqueenz.com;
    ssl_certificate /etc/letsencrypt/live/trama.beautyqueenz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trama.beautyqueenz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # Only signed selected-clue review needs a larger body. Other routes keep 8k.
    location ^~ /api/poc/sanity/game/ {
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 130s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 130s;
        proxy_buffering off;
    }
}
