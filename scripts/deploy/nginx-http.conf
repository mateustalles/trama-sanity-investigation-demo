# Bootstrap only: no login or credentials served before HTTPS is ready.
server {
    listen 80 default_server;
    server_name _;
    return 404;
}
server {
    listen 80;
    server_name trama.beautyqueenz.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/trama-demo/acme;
    }
    location / {
        return 503;
    }
}
